# Render Blueprint: a free Static Site (no server to sleep).
# In Render: New + > Blueprint > pick this repository. Set the VITE_* values in the dashboard when asked.
services:
  - type: web
    runtime: static
    name: campus-life
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_FEEDBACK_URL
        sync: false
      - key: VITE_FEEDBACK_EMAIL
        sync: false
